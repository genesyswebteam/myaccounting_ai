services:
  postgres:
    image: postgres:17-alpine
    container_name: interacc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interacc
      POSTGRES_PASSWORD: interacc
      POSTGRES_DB: interacc
    ports:
      - "5432:5432"
    volumes:
      - interacc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interacc -d interacc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interacc-pgdata:
